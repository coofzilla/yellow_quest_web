<footer class="site-shell footer">
  <div class="footer-top">
    <div>
      <a class="brand" href="{{base}}"
        ><svg aria-hidden="true" viewBox="0 0 64 64" class="brand-symbol">
          <path
            d="M32 11 49 21v22L32 53 15 43V21Z"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
          />
          <path
            d="m25 27 7 8 9-14M32 35v10"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          /></svg
        ><span>YellowQuest</span></a
      >
      <p class="mt-3 text-sm text-muted">Go outside. Find something good.</p>
    </div>
    <div class="theme-controls" aria-label="Website appearance">
      <label
        >Theme<select data-theme-select>
          <option value="highlighter">Highlighter</option>
          <option value="dracula">Dracula</option>
        </select></label
      ><label
        >Appearance<select data-mode-select>
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select></label
      >
    </div>
  </div>
  <div class="footer-bottom">
    <p>© {{year}} {{owner}} · YellowQuest</p>
    <nav aria-label="Footer navigation">
      <a href="{{base}}privacy/">Privacy policy</a
      ><a href="{{base}}support/">Get support</a>
    </nav>
  </div>
</footer>
